name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'Mesteriis/OnDesk'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit on main and a matching release tag
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          if [ "$EVENT" = workflow_dispatch ] && [ "$REF" != refs/heads/main ]; then
            echo 'Manual release verification must run from main' >&2; exit 1
          fi
          version=$(python3 scripts/version.py)
          if [ "$EVENT" = push ] && [ "$REF" != "refs/tags/v$version" ]; then
            echo 'Release tag must match all application versions' >&2; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
  instrumentation:
    needs: validate
    uses: ./.github/workflows/android-instrumentation.yml
  macos:
    needs: validate
    runs-on: [self-hosted, macOS, ARM64, ondesk-macos]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test and package macOS
        run: ./scripts/package-release.sh macos
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos
          path: build/releases/v${{ needs.validate.outputs.version }}/
          if-no-files-found: error
          retention-days: 14
  android:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0'
      - name: Test and package signed Android APKs
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ONDESK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          ONDESK_KEY_ALIAS: ondesk
        run: |
          umask 077
          export ONDESK_KEYSTORE_FILE="$RUNNER_TEMP/ondesk-release.jks"
          trap 'rm -f "$ONDESK_KEYSTORE_FILE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ONDESK_KEYSTORE_FILE"
          unset KEYSTORE_BASE64
          ./scripts/package-release.sh android
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-android
          path: build/releases/v${{ needs.validate.outputs.version }}/
          if-no-files-found: error
          retention-days: 14
      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-android-reports
          path: android/app/build/reports/
          if-no-files-found: warn
  publish:
    needs: [validate, macos, android, instrumentation]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: artifacts
      - name: Combine release files and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir release
          cp artifacts/release-macos/* release/
          cp artifacts/release-android/* release/
          cd release
          test -s "OnDesk-$VERSION-macos-arm64.zip"
          test -s "OnDesk-$VERSION-android.apk"
          test -s "OnDesk-$VERSION-camera-launcher.apk"
          test -s "OnDesk-$VERSION-screenshot-launcher.apk"
          sha256sum OnDesk-*.zip OnDesk-*.apk LICENSE THIRD_PARTY_NOTICES.md Apache-2.0.txt ZXing-Android-Embedded.txt ZXing-NOTICE.txt > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cat > notes.md <<'NOTES'
          Автоматическая сборка OnDesk: Swift-тесты, Android JVM-тесты, instrumentation на API 36/37, release lint и проверка подписей пройдены.

          Mac: macOS 27, Apple Silicon; ad-hoc подпись, без Apple notarization.
          Android: 16–17; APK подписаны постоянным релизным ключом. Debug APK с другой подписью не обновляются напрямую.
          Два дополнительных launcher APK необязательны. Контрольные суммы находятся в SHA256SUMS.txt.
          См. README, CHANGELOG и docs/RELEASING.md в исходниках этого тега для установки и ограничений.
          NOTES
          gh release create "v$VERSION" --verify-tag --target "$GITHUB_SHA" --draft --title "OnDesk $VERSION" --notes-file notes.md
          gh release upload "v$VERSION" OnDesk-*.zip OnDesk-*.apk SHA256SUMS.txt LICENSE THIRD_PARTY_NOTICES.md Apache-2.0.txt ZXing-Android-Embedded.txt ZXing-NOTICE.txt
          gh release edit "v$VERSION" --draft=false --latest
